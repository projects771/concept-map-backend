name: Keep Alive

on:
  schedule:
    # Runs every 24 hours at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch: # allows manual trigger too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          curl -f https://concept-map-backend.onrender.com/health
          echo "Backend pinged successfully"

      - name: Ping DB to keep Neo4j alive
        run: |
          curl -f https://concept-map-backend.onrender.com/health/db
          echo "Neo4j pinged successfully"
